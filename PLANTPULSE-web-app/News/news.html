<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bing News Search</title>
    <style>
        /* Add some basic styles */
        .news-card {
            border: 1px solid #ccc;
            padding: 15px;
            margin: 10px;
            border-radius: 5px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        .news-card h3 {
            margin-top: 0;
        }

        .news-card a {
            color: #1a73e8;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <h1>Bing News Search</h1>
    <div id="news-container"></div>

    <script>
        // Your Bing News API endpoint and API Key
        const endpoint = "https://api.cognitive.microsoft.com/bing/v7.0/news/search";
        const apiKey = "ee762daa02fe437d94c84f2cbc5c8f89";  // Replace with your actual API key

        // Search query (you can change this to the specific topic you're interested in)
        const searchQuery = "crop disease detection";

        // Set up the headers with the API key
        const headers = {
            "Ocp-Apim-Subscription-Key": apiKey
        };

        // Fetch news articles related to the search query
        fetch(`${endpoint}?q=${searchQuery}&count=5`, { headers })
            .then(response => response.json())  // Parse JSON response
            .then(data => {
                console.log(data);  // Log the full response data

                if (data && data.value) {
                    // Clear any existing news cards
                    document.getElementById('news-container').innerHTML = '';

                    // Display the articles in cards
                    data.value.forEach((article, index) => {
                        const newsCard = document.createElement('div');
                        newsCard.classList.add('news-card');

                        const articleTitle = document.createElement('h3');
                        const articleLink = document.createElement('a');
                        articleLink.href = article.url;
                        articleLink.target = "_blank"; // Open in a new tab
                        articleLink.textContent = article.name;

                        const articleDescription = document.createElement('p');
                        articleDescription.textContent = article.description;

                        // Append the elements to the news card
                        newsCard.appendChild(articleTitle);
                        articleTitle.appendChild(articleLink);
                        newsCard.appendChild(articleDescription);

                        // Append the news card to the container
                        document.getElementById('news-container').appendChild(newsCard);
                    });
                } else {
                    console.error("Error: No articles found or incorrect response format.");
                    document.getElementById('news-container').innerHTML = '<p>No news articles found.</p>';
                }
            })
            .catch(error => {
                console.error("Error fetching news:", error);
                document.getElementById('news-container').innerHTML = '<p>Error fetching news. Please try again later.</p>';
            });
    </script>
</body>
</html>
